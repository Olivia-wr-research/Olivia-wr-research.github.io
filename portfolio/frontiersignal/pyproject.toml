[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frontiersignal"
version = "0.2.0"
description = "Turn a public research topic into an inspectable, offline research map"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = []

[project.scripts]
frontiersignal = "frontiersignal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
frontiersignal = ["report.html"]
