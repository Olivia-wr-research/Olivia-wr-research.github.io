[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scientist-mobility-evidence"
version = "0.1.0"
description = "Offline, source-linked career event extraction and candidate trajectory tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=6,<7"]

[project.scripts]
career-evidence = "scientist_mobility.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
