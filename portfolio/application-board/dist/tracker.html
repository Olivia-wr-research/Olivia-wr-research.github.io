<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>远境 TERRAFAR · 申请清单</title><link rel="stylesheet" href="style.css?v=product-ready-20261106"><script type="module" src="app.mjs?v=product-ready-20261106"></script><script type="module" src="tracker-language.mjs?v=product-ready-20261106"></script><link rel="stylesheet" href="terrafar.css?v=product-ready-20261106"><link rel="icon" href="terrafar.svg"><style>html{background:#081521}</style></head><body class="tracker">
<aside><a class="brand" href="./"><img src="terrafar.svg" width="36" height="36" alt=""> 远境 <small>TERRAFAR</small></a><div class="eyebrow">你的下一站</div><h2>少一点忙乱，<br>多一点从容。</h2><p>把感兴趣的岗位、材料与申请进度放在一起。</p><nav><a href="./" class="nav">← 发现岗位</a><button class="nav active" id="all-view">◫ &nbsp; Opportunities</button><button class="nav" id="due-view">◷ &nbsp; Due in 14 days</button></nav><div class="side-bottom"><span class="dot"></span> 保存在当前浏览器<p>无需账号，暂不支持同步。<br>由你决定何时申请。</p><button id="privacy">数据与隐私</button></div></aside>
<main><header><div><div class="eyebrow">我的申请</div><h1>让下一站，有条不紊。</h1><p>收藏机会，准备材料，按自己的节奏向前。</p></div><button id="add" class="primary">＋ 添加申请</button></header>
<div class="notice">岗位和笔记保存在当前浏览器。可导出备份，留存一份。</div>
<section class="stats" aria-label="Workspace summary"><article><span>正在进行</span><strong id="active-count">0</strong></article><article><span>两周内截止</span><strong id="due-count">0</strong></article><article><span>待准备材料</span><strong id="material-count">0</strong></article><article><span>面试与录取</span><strong id="interview-count">0</strong></article></section>
<section class="workspace"><div class="section-head"><div><h2>我的申请</h2><p id="result-count">从第一个感兴趣的岗位开始。</p></div><div class="tools"><button id="demo">明确虚构的示例</button><button id="export">导出备份</button><button id="csv">导出表格</button><button id="import">导入备份</button><input id="file" type="file" accept="application/json,.json" hidden></div></div>
<div class="filters"><label class="search"><span class="sr">搜索</span><input id="query" placeholder="Search role, institution or notes…"></label><label><span class="sr">进度</span><select id="stage"><option value="all">全部进度</option></select></label><label><span class="sr">国家</span><select id="country"><option value="all">全部国家</option></select></label><span id="filter-mode"></span></div><div id="board" class="board"></div></section>
<footer>远境 · 探索更多可能。</footer><div id="status" role="status" aria-live="polite"></div></main>
<dialog id="editor"><form id="form"><div class="dialog-head"><div><div class="eyebrow">申请详情</div><h2 id="editor-title">添加申请</h2></div><button type="button" id="cancel" aria-label="Close">×</button></div><input name="id" type="hidden"><div class="form-grid"><label>岗位名称<input name="title" required maxlength="180" placeholder="e.g. Doctoral researcher in…"></label><label>机构<input name="institution" required maxlength="180"></label><label>国家<input name="country" maxlength="80"></label><label>岗位类别<select name="type"><option>硕士</option><option>PhD</option><option>博士后</option><option>教职</option><option>Doctoral researcher</option><option>RA</option><option>Predoc</option><option>Other</option></select></label><label>截止日期<input name="deadline" type="date"></label><label>进度<select name="stage"></select></label><label class="wide">官方岗位链接<input name="url" type="url" maxlength="1500" placeholder="https://…"></label><label class="check wide"><input name="verified" type="checkbox"> 我已自行核对来源；应用未替我验证。</label><label class="wide">所需材料（每行一项）<textarea name="materialLabels" rows="3" placeholder="CV&#10;Motivation letter&#10;Transcript"></textarea></label><label class="wide">我的笔记<textarea name="notes" rows="3" maxlength="6000" placeholder="Do not store passwords, ID numbers or confidential paper content."></textarea></label></div><div class="dialog-actions"><span>这里仅记录进度。</span><button class="primary" type="submit">保存申请</button></div></form></dialog>
<dialog id="details"><div class="dialog-head"><h2 id="detail-title"></h2><button id="close-details" aria-label="Close details">×</button></div><div id="detail-content"></div></dialog>
</body></html>
