  zhang:'https://commons.wikimedia.org/wiki/Special:FilePath/Alina_Zhang_Meng_cropped.jpg?width=640',
  xu:'https://musicyyds.sztu.edu.cn/__local/E/5B/1C/C19B63B7CD3D4A50FBEF343CB81_724B9AED_D643.jpeg',

  wang:'https://chinesemov.com/images/actors2/Wang-Zixuan-Actress-1.jpg',

};
const resultData={
  ma:{id:'ma',name:'马天宇',title:'温柔的边界守护者',line:'你不是不在乎，你只是终于学会：真心不等于无限让步。',tags:['边界感','安静体贴','清醒克制'],traits:[-0.55,-0.35,-0.4,-0.5],why:'别人以为你不主动，就是不想靠近。但其实你对感情的感受很细，只是不喜欢用热闹证明亲密。当一句话让你不舒服，你往往先沉默、再慢慢确定自己的界限。你可以理解别人的难处，也会认真守住自己的生活。',blind:'你太擅长体面离开，以至于在意你的人不一定知道你曾经认真等过。',gift:'允许别人理解得慢一点，但不必反复解释到自己精疲力尽。',pair:'张萌',pairLine:'一个擅长靠近，一个珍惜距离；差异可能让你们学会温柔而清楚地表达需求。',color:'#8299ab',src:'https://commons.wikimedia.org/wiki/File:180115_%E8%8B%B1%E9%9B%84%E6%9C%AC%E8%89%B22018_%E9%A6%96%E6%98%A0%E7%A4%BC_%E7%BA%A2%E6%AF%AF_%E9%A9%AC%E5%A4%A9%E5%AE%87_6.jpg'},
  zhang:{id:'zhang',name:'张萌',title:'永远记得为你留一份的人',line:'哪怕很久没联系，你的记忆里，也给重要的人留着座位。',tags:['主动修复','热情直接','记住细节'],traits:[0.85,0.75,0.7,0.75],why:'你像那种旅行时看到一件小东西，会突然想起某位旧友的人。你相信关系可以被重新点亮，也愿意先迈出那一步。你能带来热度和行动力，却有时会忘了：对方也许还需要一点安全距离。',blind:'你习惯用“我是在为你好”表达关心，可你的好意偶尔会跑在对方的感受前面。',gift:'真正的靠近，不只需要勇气，还需要征求对方的意愿。',pair:'马天宇',pairLine:'你的热情会融化僵局；对方的边界也提醒你，温柔不等于越界。',color:'#bd8166',src:'https://commons.wikimedia.org/wiki/File:Alina_Zhang_Meng_cropped.jpg'},
  xu:{id:'xu',name:'许飞',title:'把未说完的话写成歌的人',line:'你可以沉默很久，但真正重视的故事，你还想写一个后记。',tags:['情感存档','自省表达','留有余地'],traits:[0.25,0.15,0.92,-0.25],why:'你对旧事有惊人的记忆力，不一定记住日期，却会记住一句话带来的重量。你愿意反复琢磨“是不是哪里误会了”，也渴望有天坐下来，把每个人的版本都讲清楚。你看起来云淡风轻，心里却常常保留着一扇门。',blind:'你有时把理解误当成重来，忘了对方也有选择不回应的自由。',gift:'写完那封心里的信，不一定要寄出去；有时表达本身就是终点。',pair:'厉娜',pairLine:'一个愿意追溯缘由，一个选择照顾当下；彼此尊重，才有可能听见答案。',color:'#799c93',src:'https://musicyyds.sztu.edu.cn/info/1085/1869.htm'},
  li:{id:'li',name:'厉娜',title:'安静把人生翻到下一页的人',line:'你承认曾经很重要，但不会为了证明重要而困在昨天。',tags:['内在坚定','慢热谨慎','自我修复'],traits:[-0.85,-0.7,-0.9,-0.5],why:'热闹的场合你并不是没有情绪，只是更愿意先把它放在心里。对你来说，不是每段关系都一定要得到解释；有些事发生过，重量不会消失，但你依旧能继续生活。你的平静里藏着自己走过的很多路。',blind:'你太能自己消化委屈，别人可能误以为你没有受到伤害。',gift:'不愿意重来是你的权利；但让亲近的人看见你的真实感受，也不是示弱。',pair:'许飞',pairLine:'一个试着追问，一个练习放下；即使方向不同，也能给彼此留下一点体面。',color:'#8a9097',src:'https://ent.sina.cn/music/yneidi/2017-01-04/detail-ifxzczfc6852555.d.html'},
  wen:{id:'wen',name:'文吉儿',title:'把唯一当作认真承诺的人',line:'你想要的不是被所有人喜欢，而是被重要的人坚定地选择。',tags:['情感浓度','细腻敏锐','重视承诺'],traits:[0.95,-0.78,0.85,-0.25],why:'你可以接受朋友有很多朋友，却很难接受那些曾经说好的默契悄悄变了样。你会注意到消息里的语气，也会反复想一段关系从哪里开始失衡。你在意的不是排位，而是自己的真心有没有被同样郑重地对待。',blind:'当你把期待放得很深，可能会不自觉地要求别人以相同方式表达爱。',gift:'关系的亲密并不总有统一刻度；说清期待，比暗自对比分量更有用。',pair:'王子璇',pairLine:'一个重视关系的独特性，一个更看重说清边界；表达方式不同，不等于不重视。',color:'#af8aa3',src:'https://www.bqweekly.com/culture/2007.html'},
  wang:{id:'wang',name:'王子璇',title:'把真实摊在阳光下的人',line:'你不想靠猜维持关系，宁愿把不舒服说出来。',tags:['清晰表达','自主意识','拒绝讨好'],traits:[-0.3,0.9,-0.35,0.25],why:'你不一定是最会解释的人，但你不喜欢问题长期悬在空气里。遇到误解，你更希望大家谈清楚发生了什么，而不是用“都过去了”匆匆盖过。你愿意面对不同意见，也非常在意自己能否保留选择的空间。',blind:'表达得太快、太直接时，可能让还没准备好的人觉得无处可退。',gift:'坚定可以与耐心同时存在，不必把每次沟通都变成当场结案。',pair:'文吉儿',pairLine:'一个希望被重视，一个希望被理解；明确的规则能让感情少一点误读。',color:'#a89783',src:'https://act.chinesemov.com/actors/Wang-Zixuan-Actress'},
