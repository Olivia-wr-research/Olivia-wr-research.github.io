project:
  type: website
  output-dir: ../docs/zh
  post-render:
    - python3 ../assets/scripts/fix_bilingual_nav.py zh
  render:
    - index.qmd
    - research.qmd
    - publications.qmd
    - papers/*.qmd
    - methods.qmd
    - collaboration.qmd
    - projects.qmd
    - cv.qmd
    - contact.qmd
  resources:
    - ../assets/img/hero.jpg
    - ../assets/img/hero-optimized.jpg
    - ../assets/img/coauthor-ties-choice.svg
    - ../assets/img/corporate-innovation-data-stack.svg
    - ../assets/cv/Ran_Wang_CV_Public.pdf
    - ../assets/profile/Ran_Wang_Research_Collaboration_Profile.pdf
    - ../assets/profile/ran-wang-portrait.jpg
    - ../assets/research/urban-network-biomedical-mobility-signature-neutral.jpg
    - ../assets/research/whole-ego-mobility-signature-zh.jpg
    - ../assets/research/china-us-biomedical-innovation-signature-zh.jpg
    - ../assets/research/global-trade-network-signature-zh.jpg
    - ../assets/research/urban-resilience-nighttime-lights-signature-zh-1.png
    - ../assets/js/language-switch.js
    - ../assets/js/academic-v35.js

lang: zh-CN

website:
  title: "王冉"
  site-url: "https://olivia-wr-research.github.io/zh/"
  description: "王冉的个人学术网站，展示科学家流动、知识网络、创新与高技能职业轨迹研究。"
  search: false
  navbar:
    title: "王冉"
    left:
      - text: "首页"
        href: index.qmd
      - text: "成果"
        href: publications.qmd
      - text: "简历"
        href: cv.qmd
    right:
      - text: "GitHub"
        href: "https://github.com/Olivia-wr-research"
      - text: "English"
        href: "https://olivia-wr-research.github.io/"
  page-footer:
    left: "© 2026 王冉"
    right: "使用 Quarto 构建"

format:
  html:
    theme: cosmo
    css: styles.css
    include-after-body:
      - ../assets/js/language-switch.html
      - ../assets/js/academic-v35.html
    toc: false
    smooth-scroll: true
    link-external-newwindow: true
