name: Career Evidence portfolio checks
on:
  push:
    paths: ['portfolio/career-evidence/**', '.github/workflows/career-evidence-portfolio.yml']
  pull_request:
    paths: ['portfolio/career-evidence/**', '.github/workflows/career-evidence-portfolio.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: portfolio/career-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: career-evidence extract --input examples/synthetic-career.txt --person-id synthetic-person --out runs/extracted
      - run: career-evidence verify runs/extracted
      - run: python examples/review-organizations.py runs/extracted/events.json runs/reviewed-events.json
      - run: career-evidence derive --events runs/reviewed-events.json --normalized runs/extracted/normalized.json --out runs/trajectory
      - run: career-evidence verify runs/trajectory
      - name: Compare deterministic example files
        run: |
          diff -r runs/extracted examples/expected/extracted
          diff -r runs/trajectory examples/expected/trajectory
