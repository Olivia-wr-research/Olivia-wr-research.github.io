name: Build V6 lightweight portraits on optimization branch
on:
  push:
    branches: [perf/hhyq-v6-fast-open-20261119]
    paths:
      - '.github/workflows/hhyq-generate-portraits.yml'
      - 'docs/apps/houhuiyouqi-quiz/v6/photos-hd/**'
permissions:
  contents: write
jobs:
  optimize-portraits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow image encoder
        run: python -m pip install 'Pillow>=11,<13'
      - name: Create portrait thumbnails and screen-resolution photos
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          base=Path('docs/apps/houhuiyouqi-quiz/v6')
          original=base/'photos-hd'
          ids=['li','xu','zhang','ma','wen','wang','qing','bai']
          sizes={}
          for folder,dimension,quality in (
              ('photos-thumb',(360,540),72),
              ('photos-screen',(900,1280),77),
          ):
              dest=base/folder
              dest.mkdir(parents=True,exist_ok=True)
              total=0
              for person in ids:
                  with Image.open(original/(person+'.webp')) as f:
                      im=ImageOps.exif_transpose(f).convert('RGB')
                      im.thumbnail(dimension,Image.Resampling.LANCZOS)
                      path=dest/(person+'.webp')
                      im.save(path,'WEBP',quality=quality,method=6)
                      size=path.stat().st_size
                      total+=size
                      print(folder,person,im.size,f'{size/1024:.1f} KB',flush=True)
              sizes[folder]=total
          print('FINAL_TOTAL_BYTES',sizes,flush=True)
          assert sizes['photos-thumb']<600000,'Homepage thumbnails should stay below 600 KB'
          assert sizes['photos-screen']<2400000,'Screen photos should stay below 2.4 MB'
          PY
      - name: Commit generated WebP assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/apps/houhuiyouqi-quiz/v6/photos-thumb docs/apps/houhuiyouqi-quiz/v6/photos-screen
          if git diff --cached --quiet; then
            echo "No changed assets."
          else
            git commit -m "Generate V6 small WebP portrait assets"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
