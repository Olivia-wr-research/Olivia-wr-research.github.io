name: Literature Workbench portfolio checks
on:
  push:
    paths: ['portfolio/literature-workbench/**', '.github/workflows/literature-workbench-portfolio.yml']
  pull_request:
    paths: ['portfolio/literature-workbench/**', '.github/workflows/literature-workbench-portfolio.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: portfolio/literature-workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/validate_workspace.py
      - run: python scripts/validate_evidence.py examples/synthetic/evidence.csv --strict
      - run: python -m unittest discover -s tests -v
      - run: python scripts/release_check.py
      - name: Demonstrate project creation and summary in a disposable copy
        run: |
          python -c "import shutil,tempfile; from pathlib import Path; shutil.copytree('.',Path(tempfile.gettempdir())/'workbench-demo',ignore=shutil.ignore_patterns('.git','__pycache__'))"
          cd "$(python -c 'import tempfile;print(tempfile.gettempdir())')/workbench-demo"
          python scripts/bootstrap_project.py --name "Synthetic demonstration" --slug synthetic-demo --language en
          python scripts/summarize_project.py projects/synthetic-demo
