name: TERRAFAR Public Review and Refresh

on:
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked site when the repository has enabled automatic Pages deployment
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['docs/**', 'portfolio/application-board/**', '.github/workflows/terrafar-public-refresh.yml']

permissions:
  contents: read

concurrency:
  group: terrafar-public-pages
  cancel-in-progress: false

jobs:
  review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify baseline and automation
        working-directory: portfolio/application-board
        run: |
          diff -r dist ../../docs/apps/application-board
          node --test tests/*.test.mjs
          python3 -m unittest discover -s tests
      - name: Install official PDF text parser
        run: |
          printf '%s\n' 'pypdf==7.0.1 --hash=sha256:6131b764b046282357037309e7ef2a1b7679d4a5c53eed3db2bfbf7c673ddc2b' > "$RUNNER_TEMP/pdf-requirements.txt"
          python3 -m venv "$RUNNER_TEMP/review-python"
          "$RUNNER_TEMP/review-python/bin/python" -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/pdf-requirements.txt"
      - name: Install rendered evidence reader
        run: |
          npm install --prefix "$RUNNER_TEMP/review-browser" --ignore-scripts --no-audit --no-fund playwright-core@1.65.0
          command -v google-chrome
      - name: Recheck official evidence and stage public files
        env:
          TERRAFAR_PLAYWRIGHT_MODULE: ${{ runner.temp }}/review-browser/node_modules/playwright-core/index.mjs
          TERRAFAR_CHROME: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/terrafar-site"
          git archive HEAD:docs | tar -xf - -C "$RUNNER_TEMP/terrafar-site"
          "$RUNNER_TEMP/review-python/bin/python" portfolio/application-board/scripts/terrafar_refresh_public.py \
            --app portfolio/application-board \
            --output "$RUNNER_TEMP/terrafar-site/apps/application-board" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/terrafar-site

  deploy:
    if: vars.TERRAFAR_AUTO_PAGES == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    needs: review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated public site
        id: deployment
        uses: actions/deploy-pages@v4
