name: Generate HD JPEG fallback portraits for V6
on:
  push:
    branches: [fix/hhyq-v6-hd-jpg-fallback-20261119]
    paths:
      - '.github/workflows/hhyq-create-jpeg-portraits.yml'
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=11,<13'
      - name: Convert eight HD WebP portraits to full-resolution JPEG
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          base=Path('docs/apps/houhuiyouqi-quiz/v6')
          dest=base/'photos-hd-jpeg'
          dest.mkdir(parents=True,exist_ok=True)
          people=('li','xu','zhang','ma','wen','wang','qing','bai')
          sizes=[]
          for name in people:
              src=base/'photos-hd'/(name+'.webp')
              out=dest/(name+'.jpg')
              with Image.open(src) as picture:
                  image=ImageOps.exif_transpose(picture).convert('RGB')
                  assert image.width>300 and image.height>300, (name,image.size)
                  image.save(out,'JPEG',quality=92,subsampling=0,progressive=True,optimize=True)
                  with Image.open(out) as check:
                      assert check.size==image.size
                  sizes.append(out.stat().st_size)
                  print(name,'original pixels',image.size,'JPEG bytes',sizes[-1],flush=True)
          print('TOTAL_BYTES',sum(sizes),flush=True)
          assert len(sizes)==8 and sum(sizes)<15000000
          PY
      - name: Commit JPEG portraits back to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/apps/houhuiyouqi-quiz/v6/photos-hd-jpeg
          if ! git diff --cached --quiet; then
            git commit -m "Add full-resolution JPEG fallback images for all 8 V6 people"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
