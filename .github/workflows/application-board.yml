name: Application Board checks
on:
  push:
    paths: ['portfolio/application-board/**', 'docs/apps/application-board/**', '.github/workflows/application-board.yml']
  pull_request:
    paths: ['portfolio/application-board/**', 'docs/apps/application-board/**', '.github/workflows/application-board.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: portfolio/application-board
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned private-storage SDK for offline contract checks
        run: python -m pip install -r maintenance/terrafar-source-audit/private-storage/requirements.txt
      - run: node --test tests/*.test.mjs
      - run: python -m unittest discover -s tests -v
      - name: Check hosted static copy matches source
        run: diff -r dist ../../docs/apps/application-board
