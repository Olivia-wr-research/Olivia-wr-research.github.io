name: Hou Hui You Qi V6 release acceptance
on:
  push:
    branches: [main]
    paths:
      - 'docs/apps/houhuiyouqi-quiz/**'
      - '.github/workflows/houhuiyouqi-quiz-smoke.yml'
  pull_request:
    paths:
      - 'docs/apps/houhuiyouqi-quiz/**'
      - 'portfolio/houhuiyouqi-quiz/**'
      - '.github/workflows/houhuiyouqi-quiz-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source files and JavaScript syntax
        run: |
          test -s docs/apps/houhuiyouqi-quiz/index.html
          test -s docs/apps/houhuiyouqi-quiz/v2.css
          node --check docs/apps/houhuiyouqi-quiz/v6/v6.js
          node --check portfolio/houhuiyouqi-quiz/qa-v6.mjs
      - name: Install browser driver
        run: npm install --prefix "$RUNNER_TEMP/quiz-browser" --ignore-scripts --no-audit --no-fund playwright-core@1.65.0
      - name: Run V6 Chrome full-flow and photo checks
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory docs >/tmp/hhyq-v6-http.log 2>&1 &
          sleep 2
          export HHYQ_PW="$RUNNER_TEMP/quiz-browser/node_modules/playwright-core"
          export HHYQ_CHROME="/usr/bin/google-chrome"
          export HHYQ_OUT="/tmp/hhyq-qa"
          node portfolio/houhuiyouqi-quiz/qa-v6.mjs
      - name: Keep visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: houhuiyouqi-visual-qa
          path: /tmp/hhyq-qa/*.png
          if-no-files-found: ignore
          retention-days: 14


  ios-webkit:
    name: iPhone Safari-engine / WeChat mobile UA
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebKit engine and operating-system dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/hhyq-mobile-browser" --ignore-scripts --no-audit --no-fund playwright@1.65.0
          "$RUNNER_TEMP/hhyq-mobile-browser/node_modules/.bin/playwright" install --with-deps webkit
      - name: Test 8 public portrait assets, iPhone save, WeChat fallback
        env:
          MOBILE_PW: ${{ runner.temp }}/hhyq-mobile-browser/node_modules/playwright
          MOBILE_QA_OUT: ${{ runner.temp }}/hhyq-mobile-results
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 --directory docs >/tmp/hhyq-mobile-http.log 2>&1 &
          sleep 3
          export HHYQ_PW="$MOBILE_PW"
          export HHYQ_ENGINE=webkit
          export HHYQ_OUT="$MOBILE_QA_OUT"
          node portfolio/houhuiyouqi-quiz/qa-v6.mjs
      - name: Upload Safari-engine visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: houhuiyouqi-ios-webkit-screenshots
          path: ${{ runner.temp }}/hhyq-mobile-results/*.png
          if-no-files-found: ignore
          retention-days: 14
