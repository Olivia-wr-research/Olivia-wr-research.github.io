name: TERRAFAR Round 002 read-only audit

on:
  push:
    branches:
      - codex/terrafar-source-monitoring-20261022
    paths:
      - '.github/workflows/terrafar-round-002-smoke.yml'
      - 'portfolio/application-board/scripts/terrafar_source_audit.py'
      - 'portfolio/application-board/scripts/terrafar_round_002_preflight.py'
      - 'portfolio/application-board/maintenance/terrafar-source-audit/registry/**'
      - 'portfolio/application-board/maintenance/terrafar-source-audit/round_002/**'
      - 'portfolio/application-board/tests/test_terrafar_source_audit.py'
  # No schedule or workflow_dispatch: this only runs from the named feature branch push.

permissions:
  contents: read

concurrency:
  group: terrafar-round-002-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Diagnose one control and four frozen sample domains
        working-directory: portfolio/application-board
        run: >-
          python3 scripts/terrafar_round_002_preflight.py
          --sample-manifest maintenance/terrafar-source-audit/round_002/sample_manifest.json
          --output maintenance/terrafar-source-audit/round_002/automated_preflight.json
      - name: Save preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrafar-round-002-preflight-${{ github.run_id }}
          path: |
            portfolio/application-board/maintenance/terrafar-source-audit/round_002/sample_manifest.json
            portfolio/application-board/maintenance/terrafar-source-audit/round_002/automated_preflight.json
          if-no-files-found: warn
          retention-days: 7

  sample-first-run:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch exactly the frozen ten-source sample
        working-directory: portfolio/application-board
        env:
          R2_RUN_ID: round002-first-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          python3 scripts/terrafar_source_audit.py run --live
          --source-ids-file maintenance/terrafar-source-audit/round_002/sample_manifest.json
          --budget 10 --concurrency 1 --timeout 15 --retries 1
          --per-host-delay 1 --http-request-budget 60
          --state-dir "$RUNNER_TEMP/terrafar-round002-first-state"
          --run-id "$R2_RUN_ID"
      - name: Assemble the explicit first-run artifact allowlist
        if: always()
        working-directory: portfolio/application-board
        env:
          R2_RUN_ID: round002-first-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          export_dir="$RUNNER_TEMP/terrafar-round002-first-artifact"
          run_dir="maintenance/terrafar-source-audit/runs/$R2_RUN_ID"
          mkdir -p "$export_dir/state" "$export_dir/run"
          cp maintenance/terrafar-source-audit/round_002/sample_manifest.json "$export_dir/sample_manifest.json"
          if test -f "$run_dir/manifest.json"; then
            cp "$run_dir/manifest.json" "$run_dir/source_checks.jsonl" "$run_dir/candidate_review_queue.jsonl" "$run_dir/daily_report.json" "$run_dir/daily_report.md" "$export_dir/run/"
          fi
          if test -f "$RUNNER_TEMP/terrafar-round002-first-state/state.json"; then
            cp "$RUNNER_TEMP/terrafar-round002-first-state/state.json" "$export_dir/state/state.json"
            python3 - "$export_dir" "$R2_RUN_ID" "${GITHUB_RUN_ATTEMPT}" "${GITHUB_SHA}" <<'PY'
          import hashlib,json,pathlib,sys
          export_dir,run_id,attempt,commit=sys.argv[1:]
          root=pathlib.Path(export_dir)
          state_bytes=(root/'state/state.json').read_bytes()
          state=json.loads(state_bytes)
          manifest=json.loads((root/'run/manifest.json').read_text())
          semantic_snapshots={key:value for key,value in state.get('snapshots',{}).items() if value.get('semantic_hash') and value.get('adapter') in ('eth_listing','jobbnorge_rss')}
          if not semantic_snapshots:
              raise SystemExit('first run produced no successful semantic snapshot for the configured list adapters; restore is not testable')
          sample_bytes=(root/'sample_manifest.json').read_bytes()
          metadata={
              'origin_run_id':run_id,'origin_run_attempt':attempt,
              'artifact_name':f'terrafar-round-002-first-{run_id.rsplit("-",2)[-2]}-{attempt}',
              'commit_sha':commit,'state_schema_version':state.get('schema_version'),
              'semantic_adapter_snapshot_count':len(semantic_snapshots),
              'state_sha256':hashlib.sha256(state_bytes).hexdigest(),'state_bytes':len(state_bytes),
              'registry_sha256':manifest['registry_sha256'],'plan_sha256':manifest['plan_sha256'],
              'sample_manifest_sha256':hashlib.sha256(sample_bytes).hexdigest(),
              'runner_sha256':hashlib.sha256(pathlib.Path('scripts/terrafar_source_audit.py').read_bytes()).hexdigest(),
              'parser_sha256':{
                  'eth_listing':hashlib.sha256(pathlib.Path('scripts/import_eth.py').read_bytes()).hexdigest(),
                  'jobbnorge_rss':hashlib.sha256(pathlib.Path('scripts/import_jobbnorge.py').read_bytes()).hexdigest(),
              },
          }
          (root/'state/provenance.json').write_text(json.dumps(metadata,indent=2)+'\n')
          PY
          fi
      - name: Save first-run evidence and state snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrafar-round-002-first-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/terrafar-round002-first-artifact/
          if-no-files-found: warn
          retention-days: 7

  sample-state-restore:
    needs: sample-first-run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore first-run state artifact into a new runner directory
        uses: actions/download-artifact@v4
        with:
          name: terrafar-round-002-first-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/terrafar-round002-restored-artifact
      - name: Verify artifact hash and restore state
        env:
          R2_RUN_ID: round002-second-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          export_dir="$RUNNER_TEMP/terrafar-round002-restored-artifact"
          state_dir="$RUNNER_TEMP/terrafar-round002-restored-state"
          mkdir -p "$state_dir"
          python3 - "$export_dir/state/state.json" "$export_dir/state/provenance.json" "$state_dir/state.json" "$export_dir/sample_manifest.json" <<'PY'
          import hashlib,json,pathlib,sys
          source,meta_path,dest,sample_path=sys.argv[1:]
          data=pathlib.Path(source).read_bytes()
          metadata=json.loads(pathlib.Path(meta_path).read_text())
          state=json.loads(data)
          sample_bytes=pathlib.Path(sample_path).read_bytes()
          current_sample=pathlib.Path('portfolio/application-board/maintenance/terrafar-source-audit/round_002/sample_manifest.json').read_bytes()
          first_manifest=json.loads(pathlib.Path(source).parents[1].joinpath('run/manifest.json').read_text())
          if hashlib.sha256(data).hexdigest()!=metadata['state_sha256']:
              raise SystemExit('restored state hash mismatch')
          if hashlib.sha256(sample_bytes).hexdigest()!=metadata['sample_manifest_sha256']:
              raise SystemExit('restored sample manifest hash mismatch')
          if hashlib.sha256(current_sample).hexdigest()!=metadata['sample_manifest_sha256']:
              raise SystemExit('current sample manifest differs from first run')
          if first_manifest.get('registry_sha256')!=metadata['registry_sha256'] or first_manifest.get('plan_sha256')!=metadata['plan_sha256']:
              raise SystemExit('first run manifest provenance mismatch')
          if state.get('schema_version')!=metadata['state_schema_version']:
              raise SystemExit('restored state schema mismatch')
          if state.get('last_run_id')!=metadata['origin_run_id']:
              raise SystemExit('restored state run mismatch')
          if state.get('last_registry_sha256')!=metadata['registry_sha256']:
              raise SystemExit('restored state registry mismatch')
          if state.get('last_plan_sha256')!=metadata['plan_sha256']:
              raise SystemExit('restored state sample plan mismatch')
          semantic_snapshots={key:value for key,value in state.get('snapshots',{}).items() if value.get('semantic_hash') and value.get('adapter') in ('eth_listing','jobbnorge_rss')}
          if len(semantic_snapshots)!=metadata.get('semantic_adapter_snapshot_count',0) or not semantic_snapshots:
              raise SystemExit('restored state has no matching successful semantic adapter baseline')
          runner=pathlib.Path('portfolio/application-board/scripts/terrafar_source_audit.py')
          if hashlib.sha256(runner.read_bytes()).hexdigest()!=metadata['runner_sha256']:
              raise SystemExit('restored state runner version mismatch')
          parser_paths={
              'eth_listing':pathlib.Path('portfolio/application-board/scripts/import_eth.py'),
              'jobbnorge_rss':pathlib.Path('portfolio/application-board/scripts/import_jobbnorge.py'),
          }
          for key,path in parser_paths.items():
              if hashlib.sha256(path.read_bytes()).hexdigest()!=metadata['parser_sha256'][key]:
                  raise SystemExit('restored state parser version mismatch:'+key)
          pathlib.Path(dest).write_bytes(data)
          print(json.dumps({'restored_from_run_id':metadata['origin_run_id'],'artifact_name':metadata['artifact_name'],'state_schema_version':metadata['state_schema_version'],'state_sha256':metadata['state_sha256'],'sample_manifest_sha256':metadata['sample_manifest_sha256'],'runner_sha256':metadata['runner_sha256'],'parser_sha256':metadata['parser_sha256']}))
          PY
      - name: Re-run the same ten sources using only restored state
        working-directory: portfolio/application-board
        env:
          R2_RUN_ID: round002-second-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          python3 scripts/terrafar_source_audit.py run --live
          --source-ids-file maintenance/terrafar-source-audit/round_002/sample_manifest.json
          --budget 10 --concurrency 1 --timeout 15 --retries 1
          --per-host-delay 1 --http-request-budget 60 --require-state
          --state-dir "$RUNNER_TEMP/terrafar-round002-restored-state"
          --run-id "$R2_RUN_ID"
      - name: Require a real adapter comparison against the restored baseline
        working-directory: portfolio/application-board
        env:
          R2_RUN_ID: round002-second-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 - "$R2_RUN_ID" <<'PY'
          import json,pathlib,sys
          run_dir=pathlib.Path('maintenance/terrafar-source-audit/runs')/sys.argv[1]
          rows=[json.loads(line) for line in (run_dir/'source_checks.jsonl').read_text().splitlines() if line.strip()]
          compared=[]
          for row in rows:
              for endpoint in row.get('endpoints',[]):
                  if endpoint.get('adapter') in ('eth_listing','jobbnorge_rss') and endpoint.get('baseline_available') and endpoint.get('outcome') in ('checked_changed','checked_unchanged','checked_empty'):
                      compared.append({'source_id':row['source_id'],'endpoint_id':endpoint['endpoint_id'],'outcome':endpoint['outcome']})
          if not compared:
              raise SystemExit('second run did not compare a successful configured list adapter with the restored semantic baseline')
          (run_dir/'state_restore_verification.json').write_text(json.dumps({'status':'passed','restored_adapter_comparisons':compared},indent=2)+'\n')
          print(json.dumps({'status':'passed','restored_adapter_comparisons':compared}))
          PY
      - name: Save state restoration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrafar-round-002-restore-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            portfolio/application-board/maintenance/terrafar-source-audit/runs/round002-second-${{ github.run_id }}-${{ github.run_attempt }}/manifest.json
            portfolio/application-board/maintenance/terrafar-source-audit/runs/round002-second-${{ github.run_id }}-${{ github.run_attempt }}/source_checks.jsonl
            portfolio/application-board/maintenance/terrafar-source-audit/runs/round002-second-${{ github.run_id }}-${{ github.run_attempt }}/candidate_review_queue.jsonl
            portfolio/application-board/maintenance/terrafar-source-audit/runs/round002-second-${{ github.run_id }}-${{ github.run_attempt }}/daily_report.json
            portfolio/application-board/maintenance/terrafar-source-audit/runs/round002-second-${{ github.run_id }}-${{ github.run_attempt }}/daily_report.md
            portfolio/application-board/maintenance/terrafar-source-audit/runs/round002-second-${{ github.run_id }}-${{ github.run_attempt }}/state_restore_verification.json
          if-no-files-found: warn
          retention-days: 7
