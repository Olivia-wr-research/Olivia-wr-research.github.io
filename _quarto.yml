project:
  type: website
  output-dir: docs
  post-render:
    - python3 assets/scripts/fix_bilingual_nav.py english
  render:
    - index.qmd
    - research.qmd
    - publications.qmd
    - papers/*.qmd
    - methods.qmd
    - collaboration.qmd
    - projects.qmd
    - cv.qmd
    - contact.qmd
    - "!zh/**"
  resources:
    - assets/img/hero.jpg
    - assets/img/hero-optimized.jpg
    - assets/img/coauthor-ties-choice.svg
    - assets/img/corporate-innovation-data-stack.svg
    - assets/cv/Ran_Wang_CV_Public.pdf
    - assets/profile/Ran_Wang_Research_Collaboration_Profile.pdf
    - assets/profile/ran-wang-portrait.jpg
    - assets/js/language-switch.js
    - assets/js/academic-v35.js

lang: en

website:
  title: "Ran Wang"
  site-url: "https://olivia-wr-research.github.io"
  description: "Ran Wang studies scientific mobility, knowledge networks, innovation, and the organization of high-skilled careers across organisations and cities."
  search: false
  navbar:
    title: "Ran Wang"
    left:
      - text: "Home"
        href: index.qmd
      - text: "Publications"
        href: publications.qmd
      - text: "CV"
        href: cv.qmd
    right:
      - text: "GitHub"
        href: "https://github.com/Olivia-wr-research"
      - text: "中文"
        href: "https://olivia-wr-research.github.io/zh/"
  page-footer:
    left: "© 2026 Ran Wang"
    right: "Built with Quarto"

format:
  html:
    theme: cosmo
    css: styles.css
    include-after-body:
      - assets/js/language-switch.html
      - assets/js/academic-v35.html
    toc: false
    smooth-scroll: true
    link-external-newwindow: false
